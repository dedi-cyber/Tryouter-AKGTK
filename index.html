            setTimeLeft((prev) => prev - 1);

Topik Khusus: ${aiPromptTopic || 'Kompetensi Utama AKGTK 2026'}.

Output WAJIB berupa JSON Array murni tanpa penjelasan awalan/akhiran dengan skema berikut:
[

        const fetchWithRetry = async (url, options, retries = 3, delay = 1000) => {
          try {
            const res = await fetch(url, options);
            if (res.status === 429 && retries > 0) {
              await new Promise(resolve => setTimeout(resolve, delay));
              return fetchWithRetry(url, options, retries - 1, delay * 2);
            }
            return res;
          } catch (err) {
            if (retries > 0) {

                          }`}
                        >
                          <div className={`w-5 h-5 rounded-full border flex items-center justify-center shrink-0 mt-0.5 text-xs font-bold ${
                            isSelected ? 'border-emerald-600 bg-emerald-600 text-white' : 'border-slate-300 bg-white text-slate-500'
                          }`}>
                            {String.fromCharCode(65 + optIdx)}
                          </div>
                          <div className="flex-1 leading-snug">{optionText}</div>
                        </button>
                      );
                    })}
                  </div>

                  {examMode === 'practice' && isAnswered && (
                    <div className="mt-6 p-4 rounded-xl bg-slate-900 text-white text-xs space-y-2 border border-slate-800">
                      <div className="flex items-center space-x-2 font-bold text-amber-400">
                        <IconSparkles className="w-4 h-4" />
                        <span>Pembahasan HOTS & Landasan Aturan:</span>
                      </div>
                      <p className="text-slate-300 leading-relaxed">{currentQ.explanation}</p>
                      {currentQ.grounding && (
                        <div className="text-[11px] text-emerald-400 pt-1 border-t border-slate-800 font-mono">
                          Ref: {currentQ.grounding}
                        </div>
                      )}
                    </div>
                  )}
                </div>

                <div className="flex items-center justify-between pt-6 border-t border-slate-200 mt-6">
                  <button
                    onClick={() => setCurrentIndex((prev) => Math.max(0, prev - 1))}
                    disabled={currentIndex === 0}
                    className="px-4 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold flex items-center space-x-1 disabled:opacity-40"
                  >
                    <IconChevronLeft className="w-4 h-4" />
                    <span>Sebelumnya</span>
                  </button>

                  <span className="text-xs text-slate-500 font-medium hidden sm:inline">
                    Terjawab: {Object.keys(userAnswers).length} dari {questions.length}
                  </span>

                  <button
                    onClick={() => setCurrentIndex((prev) => Math.min(questions.length - 1, prev + 1))}
                    disabled={currentIndex === questions.length - 1}
                    className="px-4 py-2 rounded-lg bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold flex items-center space-x-1 disabled:opacity-40"
                  >
                    <span>Berikutnya</span>
                    <IconChevronRight className="w-4 h-4" />
                  </button>
                </div>
              </div>

              {/* Sidebar Question Palette */}
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex flex-col justify-between">
                <div>
                  <h4 className="font-bold text-slate-900 text-sm mb-4 pb-2 border-b border-slate-100 flex items-center justify-between">
                    <span>Navigasi Soal</span>
                    <span className="text-xs font-normal text-slate-500">{questions.length} Nomor</span>
                  </h4>

                  <div className="grid grid-cols-5 gap-2 max-h-[380px] overflow-y-auto p-1">
                    {questions.map((q, idx) => {
                      const answered = userAnswers[q.id] !== undefined;
                      const isCurrent = idx === currentIndex;
                      const flaggedQ = !!flagged[q.id];

                      let btnStyle = 'bg-slate-100 text-slate-600 border-slate-200';
                      if (flaggedQ) {
                        btnStyle = 'bg-amber-400 text-amber-950 font-bold border-amber-500';
                      } else if (answered) {
                        btnStyle = 'bg-emerald-600 text-white font-bold border-emerald-700';
                      }

                      if (isCurrent) {
                        btnStyle += ' ring-2 ring-slate-900 ring-offset-2';
                      }

                      return (
                        <button
                          key={q.id}
                          onClick={() => setCurrentIndex(idx)}
                          className={`h-9 rounded-lg text-xs font-semibold flex items-center justify-center border transition-all ${btnStyle}`}
                        >
                          {idx + 1}
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div className="mt-6 pt-4 border-t border-slate-100 space-y-2 text-[11px] text-slate-500">
                  <div className="flex items-center space-x-2">
                    <div className="w-3 h-3 rounded bg-emerald-600" />
                    <span>Terjawab</span>
                  </div>
                  <div className="flex items-center space-x-2">
                    <div className="w-3 h-3 rounded bg-amber-400" />
                    <span>Ragu-ragu</span>
                  </div>
                  <div className="flex items-center space-x-2">
                    <div className="w-3 h-3 rounded bg-slate-100 border border-slate-300" />
                    <span>Belum Dijawab</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      if (showResults) {
        const { correct, total, percentage } = scoreStats;

        const filteredQuestions = questions.filter(q => {
          const isCorrect = userAnswers[q.id] === q.correctAnswer;
          if (selectedFilter === 'correct') return isCorrect;
          if (selectedFilter === 'incorrect') return !isCorrect;
          if (selectedFilter === 'flagged') return !!flagged[q.id];
          return true;
        });

        return (
          <div className="min-h-screen bg-slate-50 text-slate-800 flex flex-col font-sans">
            <header className="bg-emerald-900 text-white py-4 shadow-md">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
                <div className="flex items-center space-x-3">
                  <IconAward className="w-7 h-7 text-amber-400" />
                  <div>
                    <h1 className="font-bold text-lg">Hasil & Rapor Analisis AKGTK 2026</h1>
                    <p className="text-xs text-emerald-200 capitalize">Posisi: {selectedRole} Madrasah</p>
                  </div>
                </div>

                <button
                  onClick={() => {
                    setShowResults(false);
                    setTestActive(false);
                  }}
                  className="bg-white/10 hover:bg-white/20 text-white text-xs font-bold px-3.5 py-2 rounded-lg transition-colors flex items-center space-x-1.5"
                >
                  <IconRotateCcw className="w-4 h-4" />
                  <span>Kembali ke Beranda</span>
                </button>
              </div>
            </header>

            <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
              {/* Score Banner */}
              <div className="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
                <div className="text-center md:border-r md:border-slate-100 md:pr-6">
                  <div className="inline-flex flex-col items-center justify-center w-32 h-32 rounded-full bg-emerald-50 border-4 border-emerald-600 text-emerald-950 mb-2">
                    <span className="text-3xl font-black">{percentage}%</span>
                    <span className="text-[11px] font-semibold text-emerald-700 uppercase">Skor Capaian</span>
                  </div>
                  <div className="text-xs font-bold text-slate-600">
                    {percentage >= 80 ? (
                      <span className="text-emerald-700 bg-emerald-100 px-2.5 py-1 rounded-full">Sangat Baik (Sangat Memuaskan)</span>
                    ) : percentage >= 65 ? (
                      <span className="text-amber-700 bg-amber-100 px-2.5 py-1 rounded-full">Baik (Memenuhi Standar)</span>
                    ) : (
                      <span className="text-red-700 bg-red-100 px-2.5 py-1 rounded-full">Perlu Evaluasi & Pembinaan</span>
                    )}
                  </div>
                </div>

                <div className="col-span-2 grid grid-cols-2 sm:grid-cols-3 gap-4">
                  <div className="p-4 bg-slate-50 rounded-2xl border border-slate-100">
                    <div className="text-slate-400 text-xs font-medium mb-1">Benar</div>
                    <div className="text-2xl font-bold text-emerald-600 flex items-center gap-1">
                      <IconCheckCircle className="w-5 h-5" />
                      <span>{correct} Soal</span>
                    </div>
                  </div>

                  <div className="p-4 bg-slate-50 rounded-2xl border border-slate-100">
                    <div className="text-slate-400 text-xs font-medium mb-1">Salah</div>
                    <div className="text-2xl font-bold text-red-500 flex items-center gap-1">
                      <IconXCircle className="w-5 h-5" />
                      <span>{total - correct} Soal</span>
                    </div>
                  </div>

                  <div className="p-4 bg-slate-50 rounded-2xl border border-slate-100 col-span-2 sm:col-span-1">
                    <div className="text-slate-400 text-xs font-medium mb-1">Total Soal</div>
                    <div className="text-2xl font-bold text-slate-800">{total} Soal</div>
                  </div>
                </div>
              </div>

              {/* Detailed Review */}
              <div className="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200">
                <div className="flex flex-wrap items-center justify-between gap-4 mb-6 pb-4 border-b border-slate-100">
                  <div>
                    <h3 className="font-bold text-slate-900 text-lg">Pembahasan Analitis & Rujukan Regulasi</h3>
                    <p className="text-xs text-slate-500">Pelajari letak kekeliruan dan alasan filosofis/hukum di balik setiap kunci jawaban.</p>
                  </div>

                  <div className="flex items-center space-x-1 bg-slate-100 p-1 rounded-xl text-xs font-semibold">
                    <button
                      onClick={() => setSelectedFilter('all')}
                      className={`px-3 py-1.5 rounded-lg transition-all ${selectedFilter === 'all' ? 'bg-white shadow text-slate-900' : 'text-slate-600'}`}
                    >
                      Semua ({questions.length})
                    </button>
                    <button
                      onClick={() => setSelectedFilter('correct')}
                      className={`px-3 py-1.5 rounded-lg transition-all ${selectedFilter === 'correct' ? 'bg-emerald-600 text-white shadow' : 'text-slate-600'}`}
                    >
                      Benar ({correct})
                    </button>
                    <button
                      onClick={() => setSelectedFilter('incorrect')}
                      className={`px-3 py-1.5 rounded-lg transition-all ${selectedFilter === 'incorrect' ? 'bg-red-600 text-white shadow' : 'text-slate-600'}`}
                    >
                      Salah ({total - correct})
                    </button>
                  </div>
                </div>

                <div className="space-y-6">
                  {filteredQuestions.map((q) => {
                    const userAns = userAnswers[q.id];
                    const isCorrect = userAns === q.correctAnswer;

                    return (
                      <div
                        key={q.id}
                        className={`p-6 rounded-2xl border transition-all ${
                          isCorrect ? 'bg-emerald-50/20 border-emerald-200' : 'bg-red-50/20 border-red-200'
                        }`}
                      >
                        <div className="flex items-start justify-between gap-2 mb-3">
                          <div className="flex items-center space-x-2">
                            <span className={`w-6 h-6 rounded-full text-xs font-bold flex items-center justify-center ${
                              isCorrect ? 'bg-emerald-600 text-white' : 'bg-red-600 text-white'
                            }`}>
                              {questions.findIndex(item => item.id === q.id) + 1}
                            </span>
                            <span className="text-xs font-bold text-slate-700 bg-slate-100 px-2.5 py-0.5 rounded-full">
                              {q.domain}
                            </span>
                          </div>

                          <span className={`text-xs font-bold px-2.5 py-0.5 rounded-full flex items-center gap-1 ${
                            isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'
                          }`}>
                            {isCorrect ? <IconCheckCircle className="w-3.5 h-3.5" /> : <IconXCircle className="w-3.5 h-3.5" />}
                            {isCorrect ? 'Jawaban Benar' : 'Jawaban Salah'}
                          </span>
                        </div>

                        <p className="text-sm font-medium text-slate-900 mb-4 leading-relaxed">{q.question}</p>

                        <div className="space-y-2 mb-4">
                          {q.options.map((optText, optIdx) => {
                            const isUserChoice = userAns === optIdx;
                            const isCorrectAnswer = q.correctAnswer === optIdx;

                            let optStyle = 'border-slate-200 bg-white text-slate-600';
                            if (isCorrectAnswer) {
                              optStyle = 'border-emerald-500 bg-emerald-100/60 font-semibold text-emerald-950 ring-1 ring-emerald-500';
                            } else if (isUserChoice && !isCorrectAnswer) {
                              optStyle = 'border-red-400 bg-red-100/60 font-semibold text-red-950 line-through';
                            }

                            return (
                              <div
                                key={optIdx}
                                className={`p-3 rounded-xl text-xs border flex items-center justify-between ${optStyle}`}
                              >
                                <span>{optText}</span>
                                {isCorrectAnswer && <span className="text-[10px] font-extrabold bg-emerald-600 text-white px-2 py-0.5 rounded">KUNCI</span>}
                                {isUserChoice && !isCorrectAnswer && <span className="text-[10px] font-extrabold bg-red-600 text-white px-2 py-0.5 rounded">PILIHAN ANDA</span>}
                              </div>
                            );
                          })}
                        </div>

                        <div className="p-4 rounded-xl bg-slate-900 text-white text-xs space-y-2">
                          <div className="font-bold text-amber-400 flex items-center gap-1.5">
                            <IconBrain className="w-4 h-4" />
                            <span>Pembahasan Analitis & Teori/Regulasi:</span>
                          </div>
                          <p className="text-slate-300 leading-relaxed">{q.explanation}</p>
                          {q.grounding && (
                            <div className="text-[11px] text-emerald-400 pt-1 border-t border-slate-800 font-mono">
                              Landasan Aturan: {q.grounding}
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </main>
          </div>
        );
      }

      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
